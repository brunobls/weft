# The kube and gke deployers (weaver-kube, weaver-gke) come from Service Weaver
# and only read [serviceweaver]; weft reads both names (see #9).
[serviceweaver]
binary = "./collatz"
rollout = "5m"

[single]
listeners.collatz = {address = "localhost:9000"}

[multi]
listeners.collatz = {address = "localhost:9000"}

[ssh]
listeners.collatz = {address = "localhost:9000"}
locations = "./ssh_locations.txt"

[gke]
regions = ["us-west1"]
listeners.collatz = {is_public = true, hostname = "collatz.example.com"}
